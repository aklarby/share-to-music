<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Share to Music</title><desc id="desc">The iPhone connects to Tailscale and a home exit node, then sends a link over SSH to the Mac queue. The Mac converts it to M4A and imports it into Music. Apple handles phone syncing.</desc>
  <rect width="1200" height="340" rx="24" fill="#171923"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="52" y="58" fill="#ff7786" font-size="13" font-weight="700" letter-spacing="3">SHARE A LINK. KEEP THE SOUND.</text>
    <text x="52" y="111" fill="#fff" font-size="38" font-weight="700">From the share sheet to your library.</text>
    <g fill="#242734" stroke="#3a3e4e" stroke-width="1">
      <rect x="52" y="154" width="236" height="119" rx="16"/><rect x="340" y="154" width="236" height="119" rx="16"/>
      <rect x="628" y="154" width="236" height="119" rx="16"/><rect x="916" y="154" width="232" height="119" rx="16"/>
    </g>
    <g fill="#fff" font-size="24" font-weight="600"><text x="76" y="203">Share on iPhone</text><text x="364" y="203">Queue on Mac</text><text x="652" y="203">Import to Music</text><text x="940" y="203">Listen on iPhone</text></g>
    <g fill="#b5b9cc" font-size="15"><text x="76" y="236">YouTube or SoundCloud</text><text x="364" y="236">Download + AAC / M4A</text><text x="652" y="236">Your local Music library</text><text x="940" y="236">Sync Library or Finder</text></g>
    <g fill="#ff7786" font-size="27"><text x="300" y="218">→</text><text x="589" y="218">→</text><text x="876" y="218">→</text></g>
    <text x="302" y="185" fill="#b5b9cc" font-size="11">SSH</text>
    <text x="52" y="310" fill="#8f95ac" font-size="13">Connect to Tailscale + your home exit node before SSH. Your Mac does the work. Apple handles phone syncing.</text>
  </g>
</svg>
