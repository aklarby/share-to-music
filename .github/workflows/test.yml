name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/build_shortcut.py
      - run: python3 scripts/build_metadata_shortcut.py
      - run: git diff --exit-code -- shortcuts
      - run: osacompile -o /tmp/import.scpt share_to_music/import.applescript
